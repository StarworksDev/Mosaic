name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The repo vendors premake5.exe (vendor/premake5/), so generation needs no
      # download and stays version-locked to what the library was authored against.
      - name: Generate (VS2022 solution)
        run: .\vendor\premake5\premake5.exe vs2022

      - name: Build Release
        run: msbuild Mosaic.sln /p:Configuration=Release /m /nologo

      - name: Test Release
        run: .\bin\Release-windows-x86_64\MosaicTests\MosaicTests.exe

  # A Linux job (gcc + clang) is added once the cross-platform burn-down passes.
  # Part A ships the windows-msvc job only -- no red CI.

  # Discord: post this repo's CI result into its thread in the ⚙️・ci-builds forum (shared action:
  # StarworksDev/.github/actions/discord-ci-notify). Never for pull requests (fork PRs get no secrets).
  notify:
    name: Discord notify
    needs: [windows-msvc]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: StarworksDev/.github/actions/discord-ci-notify@main
        with:
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
          threads: ${{ vars.DISCORD_CI_THREADS }}
          github-token: ${{ github.token }}
